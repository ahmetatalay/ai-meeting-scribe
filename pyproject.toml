[project]
name = "gpe-sre-ai-meeting-transcribe"
version = "0.1.0"
description = "Real-time AI meeting transcription with speaker detection, powered by local Whisper"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
    "numpy>=1.26",
]

[project.scripts]
scribe = "scribe_audio.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe_audio"]
