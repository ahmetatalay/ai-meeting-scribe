[project]
name = "ai-meeting-scribe"
version = "2.6.0"
description = "Real-time AI meeting transcription with speaker detection, powered by local Whisper"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
# whisper.cpp on the Apple GPU. Measured 15x faster than the default CPU
# backend on the same 30-second window; optional because it is an extra
# dependency and reports one fewer confidence signal.
metal = [
    "pywhispercpp>=1.5",
]

[project.scripts]
scribe = "scribe_audio.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe_audio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
