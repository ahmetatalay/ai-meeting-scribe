<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>scribe</title>
<style>
  :root {
    --bg: #fbfbfd;
    --panel: #ffffff;
    --border: #e3e3e8;
    --text: #1d1d20;
    --muted: #6e6e78;
    --accent: #2f6df6;
    --you: #2f6df6;
    --them: #0f9d78;
    --warn: #b0820c;
    --warn-bg: #fdf6e3;
    --err: #c8372d;
    --err-bg: #fdecea;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1e1e23;
      --border: #32323a;
      --text: #ececf0;
      --muted: #9a9aa6;
      --accent: #5b8dff;
      --you: #5b8dff;
      --them: #3fcfa3;
      --warn: #e9c46a;
      --warn-bg: #2e2812;
      --err: #ff6b5e;
      --err-bg: #331a18;
    }
  }
  * { box-sizing: border-box; }
  /* The `hidden` attribute is honoured by the user-agent stylesheet, and author
     styles beat the UA origin regardless of specificity. Any `display` rule
     below would therefore un-hide its element — which it did, leaving the
     "no meeting audio" warning and the empty footer on screen permanently. */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .spacer { flex: 1; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex: none;
  }
  .dot.live { background: var(--err); animation: pulse 1.6s ease-in-out infinite; }
  .dot.ok { background: var(--them); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  #state { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  main {
    max-width: 1080px; margin: 0 auto; padding: 22px;
    display: grid; gap: 18px; grid-template-columns: 320px 1fr;
    align-items: start;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  label:first-of-type { margin-top: 0; }
  select, input[type=text] {
    width: 100%; padding: 7px 9px; font-size: 13px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--text);
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .check { display: flex; align-items: center; gap: 7px; font-size: 13px; margin-top: 12px; }
  .check input { width: auto; margin: 0; }

  button {
    font: inherit; font-size: 14px; font-weight: 500;
    padding: 9px 16px; border-radius: 8px; border: 1px solid transparent;
    cursor: pointer; width: 100%; margin-top: 16px;
    background: var(--accent); color: #fff;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.stop { background: var(--err); }

  /* Level meters — the fastest way to see a broken audio route. */
  .meter { margin-top: 14px; }
  .meter-head {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted); margin-bottom: 4px;
  }
  .meter-head b { font-weight: 600; color: var(--text); }
  .bar {
    height: 7px; border-radius: 4px; background: var(--border); overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 0%;
    background: var(--them); border-radius: 4px;
    transition: width .1s linear;
  }
  .bar.mic i { background: var(--you); }
  .meter.dead .bar i { background: var(--err); }
  .meter small { display: block; font-size: 11px; color: var(--err); margin-top: 3px; }

  .checks { font-size: 13px; }
  .checks div { display: flex; gap: 7px; padding: 3px 0; align-items: baseline; }
  .checks .mark { flex: none; width: 14px; }
  .checks .pass { color: var(--them); }
  .checks .fail { color: var(--warn); }
  .checks em { color: var(--muted); font-style: normal; font-size: 12px; }
  .hint {
    font-size: 12px; color: var(--muted); margin-top: 10px;
    padding-top: 10px; border-top: 1px solid var(--border);
  }

  #notices:empty { display: none; }
  #pair-warn { margin: 14px 0 0; font-size: 12px; }
  .notice {
    padding: 10px 13px; border-radius: 8px; font-size: 13px;
    margin-bottom: 10px; border: 1px solid transparent;
  }
  .notice.warning { background: var(--warn-bg); color: var(--warn); border-color: currentColor; }
  .notice.error { background: var(--err-bg); color: var(--err); border-color: currentColor; }
  .notice.info { background: var(--bg); color: var(--muted); border-color: var(--border); }

  /* The transcript is its own scroll region: the page itself must not move
     when new speech arrives, or reading anything becomes impossible. */
  #library, #reader { max-height: calc(100vh - 150px); overflow-y: auto; }
  #transcript {
    position: relative;
    display: flex; flex-direction: column;
    max-height: calc(100vh - 150px);
    min-height: 320px;
  }
  #turns {
    flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin;
  }
  #turns::-webkit-scrollbar { width: 9px; }
  #turns::-webkit-scrollbar-thumb {
    background: var(--border); border-radius: 5px;
  }
  /* "Jump to latest" appears only while scrolled away from the bottom, so
     auto-scroll never yanks the view out from under someone reading. */
  #jump {
    position: absolute; left: 50%; bottom: 14px;
    transform: translateX(-50%);
    width: auto; margin: 0; padding: 6px 14px;
    font-size: 12px; border-radius: 999px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .2);
  }
  .turn { margin-bottom: 16px; }
  .turn .who {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; margin-bottom: 3px;
  }
  .turn.you .who { color: var(--you); }
  .turn.them .who { color: var(--them); }
  .turn .what { white-space: pre-wrap; }
  .turn .what span.fresh { animation: fade .5s ease-out; }
  /* Per-segment detection detail, revealed by the "Why?" toggle. */
  .why { display: none; }
  #turns.show-why .why {
    display: block; font-family: var(--mono); font-size: 11px;
    color: var(--muted); margin: 2px 0 6px;
  }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 70px 20px; }
  .empty code { font-family: var(--mono); font-size: 12px; }

  /* Summary panels */
  #notes, #summary-box { margin-bottom: 18px; }
  #notes h2, #summary-box h2 {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  #notes h2 .spacer, #summary-box h2 .spacer { flex: 1; }
  .md { font-size: 14px; line-height: 1.6; }
  .md h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 14px 0 5px; font-weight: 600;
  }
  .md h2:first-child { margin-top: 0; }
  .md ul { margin: 0; padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md p { margin: 0 0 8px; }
  .stamp { font-size: 11px; color: var(--muted); font-weight: 400; }
  .busy { color: var(--muted); font-size: 13px; }

  /* Related recordings */
  #related { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  #related h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 0 0 7px; font-weight: 600;
  }
  .rel {
    display: flex; gap: 8px; align-items: baseline; font-size: 13px;
    padding: 4px 0; cursor: pointer;
  }
  .rel:hover .rel-t { color: var(--accent); }
  .rel-t { font-weight: 500; }
  .rel-terms { font-size: 11px; color: var(--muted); font-family: var(--mono); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; }
  .tab {
    width: auto; margin: 0; padding: 5px 13px; font-size: 13px; font-weight: 500;
    background: transparent; color: var(--muted); border-radius: 7px;
  }
  .tab:hover:not(.on) { background: var(--bg); color: var(--text); filter: none; }
  .tab.on { background: var(--accent); color: #fff; }

  /* Library list */
  #search {
    width: 100%; padding: 8px 11px; font-size: 13px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); margin-bottom: 12px;
  }
  .item {
    display: flex; align-items: baseline; gap: 10px;
    padding: 11px 12px; border: 1px solid var(--border);
    border-radius: 9px; margin-bottom: 8px; cursor: pointer;
    background: var(--panel);
  }
  .item:hover { border-color: var(--accent); }
  .item .grow { flex: 1; min-width: 0; }
  .item .t { font-weight: 600; }
  .item .m {
    font-size: 12px; color: var(--muted); margin-top: 2px;
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .item .m code { font-family: var(--mono); font-size: 11px; }
  .item .acts { display: flex; gap: 4px; flex: none; }
  .icon {
    width: auto; margin: 0; padding: 4px 9px; font-size: 12px;
    background: transparent; color: var(--muted); border: 1px solid var(--border);
  }
  .icon:hover { background: var(--bg); color: var(--text); filter: none; }
  .icon.danger:hover { color: var(--err); border-color: var(--err); }

  /* Reader */
  #reader-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
  }
  #reader-head .t { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; }
  #reader-meta {
    font-size: 12px; color: var(--muted); margin-bottom: 14px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }

  footer {
    display: flex; gap: 16px; flex-wrap: wrap;
    font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--border); margin-top: 14px; padding-top: 12px;
  }
  footer code { font-family: var(--mono); font-size: 11px; word-break: break-all; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>scribe <span id="elapsed"></span></h1>
  <span class="spacer"></span>
  <div class="tabs">
    <button class="tab on" id="tab-record">Record</button>
    <button class="tab" id="tab-library">Library</button>
  </div>
  <span id="state">idle</span>
</header>

<main>
  <div>
    <div class="panel">
      <h2>Audio</h2>
      <label for="mic">Microphone — "You"</label>
      <select id="mic"></select>

      <label for="sys">Meeting audio — "Meeting"</label>
      <select id="sys"></select>

      <div class="row">
        <div>
          <label for="model">Model</label>
          <select id="model">
            <option value="tiny">tiny</option>
            <option value="small" selected>small</option>
            <option value="large-v3-turbo">large-v3-turbo</option>
            <option value="medium">medium</option>
            <option value="large-v3">large-v3</option>
          </select>
        </div>
        <div>
          <label for="lang">Language</label>
          <select id="lang">
            <option value="en" selected>English</option>
            <option value="auto">Auto-detect</option>
            <option value="tr">Türkçe</option>
            <option value="de">Deutsch</option>
            <option value="nl">Nederlands</option>
          </select>
        </div>
      </div>

      <label for="title">Title <em style="color:var(--muted)">(optional)</em></label>
      <input type="text" id="title" placeholder="Meeting 2026-11-23 10:30" autocomplete="off">

      <div class="check">
        <input type="checkbox" id="speakers" checked>
        <label for="speakers" style="margin:0">Label who is speaking</label>
      </div>

      <div class="notice warning" id="pair-warn" hidden></div>

      <button id="go">Start transcribing</button>

      <div class="meter" id="m-mic">
        <div class="meter-head"><b>Mic</b><span id="v-mic">—</span></div>
        <div class="bar mic"><i id="b-mic"></i></div>
      </div>
      <div class="meter" id="m-sys">
        <div class="meter-head"><b>Meeting</b><span id="v-sys">—</span></div>
        <div class="bar"><i id="b-sys"></i></div>
        <small id="dead-sys" hidden>No meeting audio — check routing</small>
      </div>
    </div>

    <div class="panel" style="margin-top:18px">
      <h2>Setup</h2>
      <div class="checks" id="checks"></div>
      <div class="hint" id="note"></div>
    </div>
  </div>

  <div>
    <div id="notices"></div>

    <div class="panel" id="notes" hidden>
      <h2>
        Notes so far
        <span class="spacer"></span>
        <span class="stamp" id="notes-stamp"></span>
        <button class="icon" id="notes-refresh">Refresh</button>
      </h2>
      <div class="md" id="notes-body"></div>
    </div>

    <div class="panel" id="transcript">
      <h2 style="display:flex;align-items:center;gap:10px">
        Transcript
        <span style="flex:1"></span>
        <label style="margin:0;display:flex;align-items:center;gap:5px;
                      text-transform:none;letter-spacing:0;cursor:pointer">
          <input type="checkbox" id="why" style="width:auto;margin:0">Why?
        </label>
      </h2>
      <div id="turns"></div>
      <div class="empty" id="empty">
        Pick your devices and press <code>Start transcribing</code>.
      </div>
      <button id="jump" hidden>↓ New speech</button>
    </div>
    <div class="panel" id="library" hidden>
      <h2>Recordings</h2>
      <input type="text" id="search" placeholder="Search titles and transcripts…"
             autocomplete="off">
      <div id="items"></div>
      <div class="empty" id="lib-empty" hidden></div>
    </div>

    <div class="panel" id="reader" hidden>
      <div id="reader-head">
        <span class="t" id="reader-title"></span>
        <button class="icon" id="reader-back">← Back</button>
      </div>
      <div id="reader-meta"></div>

      <div class="panel" id="summary-box" hidden>
        <h2>
          Summary
          <span class="spacer"></span>
          <span class="stamp" id="summary-stamp"></span>
          <button class="icon" id="summary-make">Summarise</button>
        </h2>
        <div class="md" id="summary-body"></div>
        <div id="related" hidden>
          <h3>Related recordings</h3>
          <div id="related-list"></div>
        </div>
      </div>

      <div id="reader-body"></div>
    </div>

    <footer id="meta" hidden>
      <span id="f-counts"></span>
      <span><code id="f-path"></code></span>
    </footer>
  </div>
</main>

<script>
const TOKEN = "__SCRIBE_TOKEN__";
const $ = id => document.getElementById(id);

async function api(path, opts = {}) {
  const url = path + (opts.method ? "" : (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN));
  const res = await fetch(url, {
    ...opts,
    headers: { ...(opts.headers || {}), "X-Scribe-Token": TOKEN,
               ...(opts.body ? { "Content-Type": "application/json" } : {}) },
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (_) {}
    throw new Error(detail);
  }
  return res.json();
}

/* ---------------------------------------------------------------- devices */

let devices = null;

async function loadDevices() {
  devices = await api("/api/devices");
  const mic = $("mic"), sys = $("sys");
  mic.innerHTML = '<option value="">None — record meeting audio only</option>';
  sys.innerHTML = '<option value="">None — record my microphone only</option>';

  for (const d of devices.inputs) {
    const name = d.name.replace(/ Series$/, "");
    const isLoopback = d.id === devices.loopback_id;
    mic.add(new Option(name, d.id));
    sys.add(new Option(isLoopback ? `${name} — meeting audio` : name, d.id));
  }

  // Assigned after populating: setting `selected` on a detached <option>
  // (the 4th argument to new Option) is not honoured reliably, which left
  // both pickers on whichever device happened to be first.
  if (devices.loopback_id !== null) sys.value = String(devices.loopback_id);
  if (devices.default_input !== null && devices.default_input !== devices.loopback_id) {
    mic.value = String(devices.default_input);
  }
  validateSelection();
}

/* The two streams must be different devices: pointing both at one input gives
   identical signals, so speaker attribution has nothing to separate. */
function validateSelection() {
  const micId = $("mic").value, sysId = $("sys").value;
  const clash = micId !== "" && micId === sysId;
  const empty = micId === "" && sysId === "";

  $("pair-warn").hidden = !clash && !empty;
  if (clash) {
    $("pair-warn").textContent =
      "Microphone and meeting audio are the same device — pick BlackHole for " +
      "meeting audio, or set one of them to None.";
  } else if (empty) {
    $("pair-warn").textContent = "Pick at least one device.";
  }
  if (!recording) $("go").disabled = clash || empty;
}

async function loadPreflight() {
  const data = await api("/api/preflight");
  $("checks").innerHTML = data.checks.map(c => `
    <div>
      <span class="mark ${c.ok ? "pass" : "fail"}">${c.ok ? "✓" : "!"}</span>
      <span>${esc(c.label)}<br><em>${esc(c.detail || "")}${c.hint ? " — " + esc(c.hint) : ""}</em></span>
    </div>`).join("");
  $("note").textContent = data.note;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ----------------------------------------------------------------- levels */

// RMS is tiny and logarithmic in perception, so map dB rather than amplitude.
function meterWidth(rms) {
  if (!rms || rms <= 0) return 0;
  const db = 20 * Math.log10(rms);
  return Math.max(0, Math.min(100, ((db + 60) / 60) * 100));
}

let sawMeeting = false;

function renderLevels(ev) {
  const set = (bar, val, active) => {
    $(bar).style.width = (active ? meterWidth(val) : 0) + "%";
  };
  set("b-mic", ev.mic, ev.mic_active);
  set("b-sys", ev.meeting, ev.meeting_active);
  $("v-mic").textContent = ev.mic_active ? fmtDb(ev.mic) : "off";
  $("v-sys").textContent = ev.meeting_active ? fmtDb(ev.meeting) : "off";

  if (ev.meeting > 1e-4) sawMeeting = true;
  const dead = ev.meeting_active && !sawMeeting && recording;
  $("m-sys").classList.toggle("dead", dead);
  $("dead-sys").hidden = !dead;

  for (const s of ev.stalled || []) {
    $(s === "mic" ? "m-mic" : "m-sys").classList.add("dead");
  }
}

function fmtDb(rms) {
  if (!rms || rms <= 0) return "−∞";
  return (20 * Math.log10(rms)).toFixed(0) + " dB";
}

/* ------------------------------------------------------------- transcript */

let lastSpeaker = null;

// How close to the bottom still counts as "following along".
const STICK_THRESHOLD_PX = 80;

function atBottom(el) {
  return el.scrollHeight - el.scrollTop - el.clientHeight <= STICK_THRESHOLD_PX;
}

function scrollToLatest(smooth) {
  const el = $("turns");
  el.scrollTo({ top: el.scrollHeight, behavior: smooth ? "smooth" : "auto" });
  $("jump").hidden = true;
}

function addSegments(segments) {
  $("empty").hidden = true;
  // Decided before appending: afterwards the geometry has already changed.
  const following = atBottom($("turns"));

  for (const seg of segments) {
    if (seg.speaker !== lastSpeaker) {
      const turn = document.createElement("div");
      turn.className = "turn " + (seg.speaker === "You" ? "you" : "them");
      turn.innerHTML = `<div class="who">${esc(seg.speaker)}</div><div class="what"></div>`;
      $("turns").append(turn);
      lastSpeaker = seg.speaker;
    }
    const turn = $("turns").lastElementChild;
    const what = turn.querySelector(".what");
    const span = document.createElement("span");
    span.className = "fresh";
    // Each segment is its own addressable node, so a later window can replace
    // it when it re-transcribes the same audio more accurately.
    span.dataset.id = seg.id;
    span.textContent = (what.textContent ? " " : "") + seg.text;
    what.append(span);

    if (seg.reason) {
      const why = document.createElement("div");
      why.className = "why";
      why.dataset.id = seg.id;
      why.textContent =
        `#${seg.id} ${seg.speaker} — mic +${fmt(seg.mic_db)}dB vs ` +
        `meeting +${fmt(seg.meeting_db)}dB — ${seg.reason}`;
      turn.append(why);
    }
  }

  if (following) scrollToLatest(false);
  else $("jump").hidden = false;
}

function fmt(v) { return v === null || v === undefined ? "?" : v.toFixed(1); }

/* A later window re-transcribed audio already on screen, with the following
   context the first pass lacked. Drop what it supersedes and re-render. */
function reviseSegments(fromId, segments) {
  for (const node of $("turns").querySelectorAll("[data-id]")) {
    if (Number(node.dataset.id) >= fromId) node.remove();
  }
  for (const turn of [...$("turns").querySelectorAll(".turn")]) {
    if (!turn.querySelector(".what").textContent.trim()) turn.remove();
  }

  const turns = $("turns").querySelectorAll(".turn");
  lastSpeaker = turns.length
    ? turns[turns.length - 1].querySelector(".who").textContent
    : null;

  addSegments(segments);
}

// One banner per kind of problem, not one per occurrence. Falling behind
// repeatedly produced a fresh banner each window and eight of them pushed the
// transcript off screen — the thing you are actually trying to read.
function addNotice(ev) {
  const box = $("notices");
  const existing = ev.code
    ? box.querySelector(`[data-code="${CSS.escape(ev.code)}"]`)
    : null;

  // A resolved condition retracts its warning rather than adding to the pile.
  if (ev.resolved) {
    if (existing) existing.remove();
    return;
  }

  if (existing) {
    const seen = (Number(existing.dataset.seen) || 1) + 1;
    existing.dataset.seen = seen;
    existing.textContent = `${ev.message} (×${seen})`;
    return;
  }

  const el = document.createElement("div");
  el.className = "notice " + ev.level;
  el.textContent = ev.message;
  if (ev.code) el.dataset.code = ev.code;
  el.dataset.seen = 1;
  box.append(el);
  if (ev.level === "info") setTimeout(() => el.remove(), 6000);
}

/* ------------------------------------------------------------------ state */

let recording = false, startedAt = null, timer = null;

function setState(value) {
  $("state").textContent = value.replace(/_/g, " ");
  recording = value === "recording";
  const dot = $("dot");
  dot.className = "dot" + (recording ? " live" : value === "stopped" ? " ok" : "");

  $("go").textContent = recording ? "Stop" : "Start transcribing";
  $("go").className = recording ? "stop" : "";
  $("go").disabled = value === "loading_model" || value === "stopping";
  for (const id of ["mic", "sys", "model", "lang", "title", "speakers"]) {
    $(id).disabled = recording || value === "loading_model";
  }

  if (!recording) {
    for (const id of ["m-mic", "m-sys"]) $(id).classList.remove("dead");
    $("dead-sys").hidden = true;
    $("b-mic").style.width = "0%";
    $("b-sys").style.width = "0%";
    $("v-mic").textContent = "—";
    $("v-sys").textContent = "—";
    sawMeeting = false;
    validateSelection();
  }

  if (recording) {
    checkSummarizer().then(st => {
      notesAvailable = st.available;
      $("notes").hidden = !st.available || view !== "record";
      $("notes-refresh").disabled = !st.available;
      if (st.available && !$("notes-body").textContent) {
        $("notes-body").className = "md busy";
        $("notes-body").textContent =
          "Press Refresh to summarise what has been said so far. Each press " +
          "reads only the new speech and folds it into the summary.";
      }
    });
  }

  if (recording && !timer) {
    startedAt = Date.now();
    timer = setInterval(tick, 1000);
  } else if (!recording && timer) {
    clearInterval(timer);
    timer = null;
  }
}

function tick() {
  const s = Math.floor((Date.now() - startedAt) / 1000);
  $("elapsed").textContent =
    `· ${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
}

/* ------------------------------------------------------------------ events */

function connect() {
  const es = new EventSource("/api/events?token=" + encodeURIComponent(TOKEN));
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === "levels") renderLevels(ev);
    else if (ev.type === "segments") addSegments(ev.segments);
    else if (ev.type === "revise") reviseSegments(ev.from_id, ev.segments);
    else if (ev.type === "notes") showNotes(ev);
    else if (ev.type === "state") setState(ev.value);
    else if (ev.type === "notice") addNotice(ev);
    else if (ev.type === "session" && ev.markdown) {
      $("meta").hidden = false;
      $("f-path").textContent = ev.markdown;
    } else if (ev.type === "summary") {
      if (view === "library") loadLibrary();
      const s = ev.stats;
      const who = Object.entries(s.speakers).map(([k, v]) => `${k} ${v}`).join(", ");
      $("f-counts").textContent =
        `${s.segments} segments · ${s.words} words${who ? " · " + who : ""}`;
    }
  };
  es.onerror = () => { /* EventSource reconnects on its own */ };
}

/* ----------------------------------------------------------------- library */

let view = "record";

function setView(next) {
  view = next;
  $("tab-record").classList.toggle("on", next === "record");
  $("tab-library").classList.toggle("on", next !== "record");

  $("transcript").hidden = next !== "record";
  $("notes").hidden = next !== "record"
    || !(notesAvailable || $("notes-body").textContent);
  $("meta").hidden = next !== "record" || !$("f-path").textContent;
  $("library").hidden = next !== "library";
  $("reader").hidden = next !== "reader";

  if (next === "library") loadLibrary();
}

function human(seconds) {
  if (seconds === null || seconds === undefined) return null;
  const m = Math.floor(seconds / 60), s2 = Math.round(seconds % 60);
  return m ? `${m}m ${s2}s` : `${s2}s`;
}

function whenLabel(iso) {
  if (!iso) return "unknown date";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString(undefined, {
    year: "numeric", month: "short", day: "numeric",
    hour: "2-digit", minute: "2-digit",
  });
}

async function loadLibrary() {
  const q = $("search").value.trim();
  let data;
  try {
    data = await api("/api/transcripts?q=" + encodeURIComponent(q));
  } catch (err) {
    addNotice({ level: "error", message: "Could not list recordings: " + err.message });
    return;
  }

  const list = data.transcripts;
  $("items").innerHTML = "";
  $("lib-empty").hidden = list.length > 0;
  // Markdown scribe did not produce is skipped rather than offered with a
  // Delete button; say so, or an empty list looks like a bug.
  const skipped = data.skipped
    ? ` ${data.skipped} other markdown file${data.skipped > 1 ? "s" : ""} in this folder ${data.skipped > 1 ? "were" : "was"} ignored.`
    : "";
  $("lib-empty").textContent = q
    ? `Nothing matches "${q}".`
    : "No recordings in " + data.directory + "." + skipped;

  for (const t of list) {
    const bits = [whenLabel(t.started)];
    const dur = human(t.duration_seconds);
    if (dur) bits.push(dur);
    bits.push(`${t.words} words`);
    const who = Object.entries(t.speakers || {})
      .map(([k, v]) => `${k} ${v}`).join(", ");
    if (who) bits.push(who);
    if (t.has_summary) bits.push("summarised");

    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `
      <div class="grow">
        <div class="t"></div>
        <div class="m">
          <span></span>
          <code></code>
        </div>
      </div>
      <div class="acts">
        <button class="icon js-rename" title="Rename">Rename</button>
        <button class="icon danger js-delete" title="Delete">Delete</button>
      </div>`;
    row.querySelector(".t").textContent = t.title;
    row.querySelector(".m span").textContent = bits.join(" · ");
    row.querySelector(".m code").textContent = t.relative_path;

    row.querySelector(".grow").onclick = () => openTranscript(t.name);
    row.querySelector(".js-rename").onclick = e => {
      e.stopPropagation();
      renameTranscript(t);
    };
    row.querySelector(".js-delete").onclick = e => {
      e.stopPropagation();
      deleteTranscript(t);
    };
    $("items").append(row);
  }
}

async function openTranscript(name) {
  let data;
  try {
    data = await api("/api/transcripts/" + encodeURIComponent(name));
  } catch (err) {
    addNotice({ level: "error", message: "Could not open: " + err.message });
    return;
  }

  $("reader-title").textContent = data.title;
  const bits = [whenLabel(data.started)];
  const dur = human(data.duration_seconds);
  if (dur) bits.push(dur);
  bits.push(`${data.words} words`);
  if (data.model) bits.push(data.model);
  $("reader-meta").textContent = bits.join(" · ") + " — " + data.relative_path;

  readerName = name;
  $("summary-box").hidden = false;
  showSummary(data.summary);
  // checkSummarizer caches, so this is cheap; unlike a permanent cache it also
  // notices a model server started after the page was loaded.
  const st = await checkSummarizer();
  $("summary-make").disabled = !st.available;
  $("summary-make").title = st.available ? "" : summarizerUnavailableMessage(st);
  if (!data.summary && !st.available) {
    $("summary-body").className = "md busy";
    $("summary-body").textContent = summarizerUnavailableMessage(st);
  }
  loadRelated(name);

  const body = $("reader-body");
  body.innerHTML = "";
  let last = null;
  for (const turn of data.turns) {
    if (turn.speaker !== last) {
      const el = document.createElement("div");
      el.className = "turn " + (turn.speaker === "You" ? "you" : "them");
      el.innerHTML = '<div class="who"></div><div class="what"></div>';
      el.querySelector(".who").textContent = turn.speaker || "Transcript";
      body.append(el);
      last = turn.speaker;
    }
    const what = body.lastElementChild.querySelector(".what");
    what.textContent = (what.textContent ? what.textContent + " " : "") + turn.text;
  }
  setView("reader");
}

async function renameTranscript(t) {
  const title = prompt("Rename this recording:", t.title);
  if (title === null || !title.trim()) return;
  try {
    await api(`/api/transcripts/${encodeURIComponent(t.name)}/title`, {
      method: "POST",
      body: JSON.stringify({ title: title.trim() }),
    });
    loadLibrary();
  } catch (err) {
    addNotice({ level: "error", message: "Rename failed: " + err.message });
  }
}

async function deleteTranscript(t) {
  // Irreversible: there is no trash, so make the filename explicit.
  if (!confirm(`Delete "${t.title}" permanently?\n\n${t.relative_path}\n\n` +
               "This cannot be undone.")) return;
  try {
    await api("/api/transcripts/" + encodeURIComponent(t.name), { method: "DELETE" });
    loadLibrary();
  } catch (err) {
    addNotice({ level: "error", message: "Delete failed: " + err.message });
  }
}

/* --------------------------------------------------------------- summaries */

// Minimal markdown: headings, bullets, checkboxes. Built with textContent so
// model output is never interpolated as HTML.
function renderMarkdown(target, md) {
  target.innerHTML = "";
  let list = null;
  for (const raw of (md || "").split("\n")) {
    const line = raw.trim();
    if (!line) { list = null; continue; }

    if (line.startsWith("#")) {
      const h = document.createElement("h2");
      h.textContent = line.replace(/^#+\s*/, "");
      target.append(h);
      list = null;
    } else if (/^[-*]\s/.test(line)) {
      if (!list) { list = document.createElement("ul"); target.append(list); }
      const li = document.createElement("li");
      li.textContent = line.replace(/^[-*]\s*/, "").replace(/^\[[ xX]\]\s*/, "");
      if (/^\[[ xX]\]/.test(line.replace(/^[-*]\s*/, ""))) {
        li.textContent = "☐ " + li.textContent;
      }
      list.append(li);
    } else {
      const p = document.createElement("p");
      p.textContent = line;
      target.append(p);
      list = null;
    }
  }
}

let summarizerStatus = null;
// Whether the live notes panel should be on screen at all: true once a
// recording starts with a working summariser, and kept true afterwards so the
// notes stay readable when the recording stops.
let notesAvailable = false;

// Each status check reaches Ollama, so repeated calls are not free. Callers ask
// freely — on every state change, on every view switch — so the answer is held
// briefly and concurrent callers share one request. Whether a local model
// server is installed does not change second to second.
const SUMMARIZER_STATUS_TTL_MS = 30000;
let summarizerCheckedAt = 0;
let summarizerInFlight = null;

async function checkSummarizer() {
  if (summarizerStatus &&
      Date.now() - summarizerCheckedAt < SUMMARIZER_STATUS_TTL_MS) {
    return summarizerStatus;
  }
  if (summarizerInFlight) return summarizerInFlight;

  summarizerInFlight = (async () => {
    try {
      summarizerStatus = await api("/api/summarizer");
    } catch (_) {
      summarizerStatus = { available: false, detail: "status unavailable" };
    }
    summarizerCheckedAt = Date.now();
    return summarizerStatus;
  })().finally(() => { summarizerInFlight = null; });

  return summarizerInFlight;
}

function summarizerUnavailableMessage(st) {
  return (st.detail || "Summarisation is unavailable")
    + (st.hint ? ` — run: ${st.hint}` : "");
}

function showNotes(ev) {
  notesAvailable = true;
  if (view === "record") $("notes").hidden = false;
  $("notes-body").className = "md";
  renderMarkdown($("notes-body"), ev.text);
  const bits = [ev.model].filter(Boolean);
  if (ev.covered_words) bits.push(`${ev.covered_words} words read`);
  // Surfacing the pass time makes it obvious when a bigger model cannot keep
  // up with the meeting, rather than leaving the panel mysteriously stale.
  if (ev.latency) bits.push(`${ev.latency}s`);
  $("notes-stamp").textContent = bits.join(" · ");
}

// Summarising is on demand: a 14B model costs ~20GB resident and seconds of
// CPU per pass, so it runs when asked rather than on a timer.
async function refreshNotes() {
  const btn = $("notes-refresh");
  const was = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Summarising…";
  try {
    const notes = await api("/api/summarize", { method: "POST" });
    if (notes.text) showNotes(notes);
  } catch (err) {
    addNotice({ level: "warning", message: err.message });
  } finally {
    btn.disabled = false;
    btn.textContent = was;
  }
}

let readerName = null;

function showSummary(summary) {
  if (summary && summary.text) {
    renderMarkdown($("summary-body"), summary.text);
    $("summary-stamp").textContent =
      `${summary.model} · ${whenLabel(summary.generated)}`;
  } else {
    $("summary-body").className = "md busy";
    $("summary-body").textContent = "No summary yet.";
    $("summary-stamp").textContent = "";
  }
}

async function makeSummary() {
  if (!readerName) return;
  const btn = $("summary-make");
  btn.disabled = true;
  $("summary-body").className = "md busy";
  $("summary-body").textContent = "Summarising locally… this can take a minute.";
  try {
    const summary = await api(
      `/api/transcripts/${encodeURIComponent(readerName)}/summary`,
      { method: "POST" }
    );
    $("summary-body").className = "md";
    showSummary(summary);
    loadLibrary();
  } catch (err) {
    $("summary-body").className = "md busy";
    $("summary-body").textContent = err.message;
  } finally {
    btn.disabled = false;
  }
}

async function loadRelated(name) {
  $("related").hidden = true;
  let found;
  try {
    found = (await api(`/api/transcripts/${encodeURIComponent(name)}/related`)).related;
  } catch (_) {
    return;
  }
  if (!found.length) return;

  $("related-list").innerHTML = "";
  for (const r of found) {
    const row = document.createElement("div");
    row.className = "rel";
    row.innerHTML = '<span class="rel-t"></span><span class="rel-terms"></span>';
    row.querySelector(".rel-t").textContent = r.title;
    // Shared terms are shown so the link can be judged rather than trusted.
    row.querySelector(".rel-terms").textContent = r.shared_terms.join(", ");
    row.onclick = () => openTranscript(r.name);
    $("related-list").append(row);
  }
  $("related").hidden = false;
}

/* ------------------------------------------------------------------ actions */

$("notes-refresh").onclick = refreshNotes;
$("summary-make").onclick = makeSummary;

$("tab-record").onclick = () => setView("record");
$("tab-library").onclick = () => setView("library");
$("reader-back").onclick = () => setView("library");

let searchTimer = null;
$("search").oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadLibrary, 180);
};

$("why").onchange = () =>
  $("turns").classList.toggle("show-why", $("why").checked);

$("jump").onclick = () => scrollToLatest(true);
$("turns").onscroll = () => {
  if (atBottom($("turns"))) $("jump").hidden = true;
};

$("mic").onchange = validateSelection;
$("sys").onchange = validateSelection;

$("go").onclick = async () => {
  $("go").disabled = true;
  try {
    if (recording) {
      await api("/api/stop", { method: "POST" });
    } else {
      $("turns").innerHTML = "";
      $("notices").innerHTML = "";
      $("jump").hidden = true;
      $("notes-body").textContent = "";
      $("notes-stamp").textContent = "";
      lastSpeaker = null; sawMeeting = false;
      await api("/api/start", {
        method: "POST",
        body: JSON.stringify({
          mic_device: $("mic").value || null,
          system_device: $("sys").value || null,
          model: $("model").value,
          language: $("lang").value,
          title: $("title").value.trim() || null,
          use_speakers: $("speakers").checked,
        }),
      });
    }
  } catch (err) {
    addNotice({ level: "error", message: err.message });
    $("go").disabled = false;
  }
};

(async () => {
  try {
    await loadDevices();
    await loadPreflight();
  } catch (err) {
    addNotice({ level: "error", message: "Could not read audio devices: " + err.message });
  }
  connect();
  setInterval(() => { if (!recording) loadPreflight().catch(() => {}); }, 5000);
})();
</script>
